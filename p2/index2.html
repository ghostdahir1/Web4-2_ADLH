<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<body>

    <main>
        <section id="contenedor-login">
            <h1>Iniciar Sesión</h1>
            <p>Por favor, ingresa tus credenciales para acceder al sistema.</p>

            <!-- El atributo action="#" evita que la página busque otro archivo al dar clic -->
            <form action="#" method="POST">

                <!-- Campo de Usuario / Correo -->
                <div>
                    <label for="usuario">Correo electrónico o Usuario:</label><br>
                    <input type="email"
                           id="usuario"
                           name="usuario"
                           placeholder="ejemplo@correo.com"
                           required>
                </div>

                <br>

                <!-- Campo de Contraseña -->
                <div>
                    <label for="password">Contraseña:</label><br>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           required>
                </div>

                <br>

                <!-- Opciones adicionales (Recordar y Recuperar) -->
                <div>
                    <input type="checkbox" id="recordarme" name="recordarme">
                    <label for="recordarme">Recordar mi sesión</label>
                </div>

                <br>

                <!-- Botón de acción -->
                <div>
                    <button type="submit">Entrar</button>
                </div>

            </form>

            <hr>

            <!-- Enlaces de apoyo -->
            <footer>
                <p><a href="#">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
            </footer>
        </section>
    </main>

</body>
</html>
