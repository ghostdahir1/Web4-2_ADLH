<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pedidos - RF02</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,600&family=Roboto+Mono:wght@400;500&family=Roboto+Serif:wght@600&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section id="contenedor-pedido">

            <div class="encabezado-icono">
                <span class="icono-circulo azul">
                    <i class="bi bi-clipboard-check"></i>
                </span>
            </div>

            <h1>Registro de Pedidos</h1>
            <p class="subtitulo">Área de ventas - Nuevo pedido (RF02)</p>

            <form action="#" method="POST">

                <div class="campo">
                    <label for="cliente">
                        <span class="icono-circulo azul"><i class="bi bi-person"></i></span>
                        Nombre del cliente:
                    </label>
                    <input type="text"
                           id="cliente"
                           name="cliente"
                           placeholder="Ej. Juan Pérez"
                           required>
                </div>

                <div class="campo">
                    <label for="producto">
                        <span class="icono-circulo amarillo"><i class="bi bi-box-seam"></i></span>
                        Producto:
                    </label>
                    <select id="producto" name="producto" required>
                        <option value="" disabled selected>Selecciona un producto...</option>
                        <option value="producto_1">Producto 1</option>
                        <option value="producto_2">Producto 2</option>
                        <option value="producto_3">Producto 3</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cantidad">
                        <span class="icono-circulo rosa"><i class="bi bi-plus-circle"></i></span>
                        Cantidad del producto:
                    </label>
                    <input type="number"
                           id="cantidad"
                           name="cantidad"
                           min="1"
                           placeholder="Ej. 5"
                           required>
                </div>

                <div class="campo">
                    <label for="fecha_entrega">
                        <span class="icono-circulo verde"><i class="bi bi-truck"></i></span>
                        Fecha y hora estimada de entrega:
                    </label>
                    <input type="datetime-local"
                           id="fecha_entrega"
                           name="fecha_entrega"
                           required>
                </div>

                <div>
                    <button type="submit">
                        <i class="bi bi-check2-circle"></i> Registrar Pedido
                    </button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
